name: Build and Push to ACR

on:
  push:
    branches:
      - dev # 개발 중

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secret.AZURE_CREDENTIALS }}

      - name: Azure ACR login
        run: az acr login --name ohnpolv2

      - name: Build and push Docker image
        run: |
          docker build -t ohnpolv2.azurecr.io/ohnpol-v2:dev .
          docker push ohnpolv2.azurecr.io/ohnpol-v2:dev